<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 191" width="1128" height="191">
  <defs>
    <linearGradient id="compEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <radialGradient id="compAura" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0" />
    </radialGradient>

    <pattern id="compTechGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#FFFFFF" fill-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="1128" height="191" fill="#0A0A0A" />
  <rect width="1128" height="191" fill="url(#compTechGrid)" />
  <rect width="1128" height="191" fill="url(#compAura)" />
  <rect x="0" y="0" width="1128" height="2.5" fill="url(#compEmerald)" />

  <!-- Background telemetry lines -->
  <g stroke="#1F1F1F" stroke-width="1" opacity="0.6">
    <line x1="720" y1="0" x2="1128" y2="130" stroke-dasharray="3 5" />
    <line x1="620" y1="191" x2="980" y2="0" />
  </g>
  <circle cx="820" cy="40" r="2.5" fill="#22C55E" opacity="0.7" />
  <circle cx="950" cy="90" r="2" fill="#FFFFFF" opacity="0.4" />
  <line x1="820" y1="40" x2="950" y2="90" stroke="#22C55E" stroke-width="0.7" opacity="0.25" />

  <!-- Main Hero Content (Shifted to x=180 for generous layout room) -->
  <g transform="translate(180, 28)">
    
    <!-- Wordmark + Emblem -->
    <g transform="translate(0, 0)">
      <!-- Kinetic 'K' -->
      <g transform="translate(0, -2)">
        <rect x="0" y="0" width="8" height="34" rx="2" fill="#FFFFFF" />
        <path d="M8 16 L22 2 C24 0.5, 27 1.5, 27 4.5 L27 10.5 C27 12, 25.5 13.5, 23 15.5 L14 22 Z" fill="#22C55E" />
        <path d="M12 19 L22 30 C25 33, 27 34, 27 35 L20 35 C18 35, 15.5 33.5, 13.5 30 L8 24 Z" fill="#FFFFFF" />
        <circle cx="12.5" cy="20.5" r="2.8" fill="#22C55E" />
      </g>

      <!-- Wordmark Text -->
      <text x="36" y="24" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="-0.03em">KINETIX</text>
      
      <!-- AI Badge -->
      <g transform="translate(142, 4)">
        <rect x="0" y="0" width="34" height="22" rx="4" fill="rgba(34, 197, 94, 0.12)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1" />
        <text x="17" y="15.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="900" fill="#22C55E" text-anchor="middle">AI</text>
      </g>

      <!-- Studio Tag -->
      <text x="188" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#22C55E" letter-spacing="0.08em">AI ENGINEERING STUDIO</text>
    </g>

    <!-- Bold Main Headline -->
    <g transform="translate(0, 64)">
      <text font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="-0.025em">
        We build AI systems for <tspan fill="#22C55E">businesses</tspan> that need <tspan fill="#22C55E">results.</tspan>
      </text>
    </g>

    <!-- Feature Tags Strip -->
    <g transform="translate(0, 94)">
      <text font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#A3A3A3">
        <tspan fill="#22C55E">● </tspan>Workflow Automation  <tspan fill="#22C55E">  ● </tspan>Autonomous Agents  <tspan fill="#22C55E">  ● </tspan>Enterprise RAG  <tspan fill="#22C55E">  ● </tspan>Custom AI SaaS
      </text>
    </g>
  </g>

  <!-- Right Contact Card: Positioned at x=880 -->
  <g transform="translate(880, 56)">
    <rect x="0" y="0" width="220" height="74" rx="7" fill="#111111" stroke="#222222" stroke-width="1" />
    
    <g transform="translate(14, 20)">
      <circle cx="3" cy="3" r="2.5" fill="#22C55E" />
      <text x="12" y="7" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#22C55E">DIRECT INQUIRIES</text>
    </g>

    <g transform="translate(14, 50)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#FFFFFF">info@kinetixai.cc</text>
    </g>
  </g>
</svg>
