<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="kinetixGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
  </defs>

  <!-- Background for dark presentation -->
  <rect width="420" height="100" rx="12" fill="#0A0A0A" />

  <!-- Geometric Kinetic 'K' Mark -->
  <g transform="translate(24, 20)">
    <!-- Vertical Pillar -->
    <rect x="0" y="0" width="12" height="60" rx="3" fill="#FFFFFF" />
    
    <!-- Upper Diagonal Ray -->
    <path d="M12 28 L38 4 C40 2, 44 4, 44 8 L44 18 C44 20, 42 22, 38 26 L22 38 Z" fill="#22C55E" />
    
    <!-- Lower Diagonal Ray -->
    <path d="M20 34 L38 52 C42 56, 44 58, 44 60 L32 60 C30 60, 26 57, 22 52 L12 40 Z" fill="#FFFFFF" />
    
    <!-- Central Kinetic Focal Node -->
    <circle cx="21" cy="35" r="4.5" fill="#22C55E" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(86, 62)">
    <!-- KINETIX text -->
    <text font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">KINETIX</text>
    
    <!-- AI Accent Badge -->
    <g transform="translate(162, -26)">
      <rect x="0" y="0" width="48" height="30" rx="6" fill="rgba(34, 197, 94, 0.14)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1.5" />
      <text x="24" y="21" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#22C55E" text-anchor="middle" letter-spacing="0.04em">AI</text>
    </g>
  </g>
</svg>
